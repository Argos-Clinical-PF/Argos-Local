services:
  postgres:
    image: postgres:16-alpine
    container_name: argos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argos_clinical}
      POSTGRES_USER: ${POSTGRES_USER:-argos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argos_app_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - argos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../Argos-Backend
      target: development
    container_name: argos-backend
    env_file:
      - .env 
    environment:
      SERVER_PORT: 8080
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-argos_clinical}
      DB_USERNAME: ${POSTGRES_USER:-argos_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-argos_app_local}
      DB_MIGRATIONS_ENABLED: ${DB_MIGRATIONS_ENABLED:-true}
      TRANSCRIPCION_SERVICE_URL: ${TRANSCRIPCION_SERVICE_URL:-http://transcripcion:9000}
      TRANSCRIPCION_REALTIME_TIMEOUT_SECONDS: ${TRANSCRIPCION_REALTIME_TIMEOUT_SECONDS:-20}
      TRANSCRIPCION_REALTIME_RETRIES: ${TRANSCRIPCION_REALTIME_RETRIES:-3}
      TRANSCRIPCION_REALTIME_BACKOFF_MS: ${TRANSCRIPCION_REALTIME_BACKOFF_MS:-1000}
      EMOCIONES_SERVICE_URL: ${EMOCIONES_SERVICE_URL:-http://emociones:9010}
      # ARGOS-169 / ADR-025: enciende la ruta /embed + /infer/fusion en el backend. Los TRES
      # cambios van juntos -este, WHISPER_EMBEDDING_MODEL y la fusion v3- o la guarda de
      # encoder rechaza los embeddings. Revertir: poner false y reiniciar el backend.
      #
      # ARGOS-110: fusión intermedia pasa a ser el default también en local, igual que en
      # producción -este repo quedó atrasado, era el único de los tres que seguía en false-.
      # WHISPER_EMBEDDING_MODEL (más abajo) también quedó atrasado con el mismo patrón — corregido
      # junto con esto.
      #
      # ARGOS-PF: la reversión ya NO es "volver a la fusión tardía" — esa se eliminó del código.
      # En false el backend usa la salida DIRECTA del modelo visual (/infer/video), que es además
      # lo que corre siempre en sesión presencial, con o sin esta bandera.
      ARGOS_FUSION_INTERMEDIA_ENABLED: ${ARGOS_FUSION_INTERMEDIA_ENABLED:-true}
      EMOCIONES_TIMEOUT_MS: ${EMOCIONES_TIMEOUT_MS:-5000}
      ARGOS_TEMAS_PROVIDER: ${ARGOS_TEMAS_PROVIDER:-LOCAL}
      ARGOS_TEMAS_MIN_CONFIDENCE: ${ARGOS_TEMAS_MIN_CONFIDENCE:-0.60}
      ANTHROPIC_TOPICS_MODEL: ${ANTHROPIC_TOPICS_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_TOPICS_MAX_TOKENS: ${ANTHROPIC_TOPICS_MAX_TOKENS:-900}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-argosclinical@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-argosclinical@gmail.com}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      EMAIL_VERIFICATION_EXPIRATION_HOURS: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:-24}
      JWT_SECRET: ${JWT_SECRET:-argos-clinical-local-dev-secret-32-bytes-minimum}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_ISSUER: ${JWT_ISSUER:-argos-clinical}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      # Back Office: sin estas dos variables, el seed del primer ADMIN_PLATAFORMA no se ejecuta
      # (nunca hay credenciales por defecto conocidas). Ver Argos-Backend AdminSeedRunner.
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      RECORDINGS_ENABLED: ${RECORDINGS_ENABLED:-false}
      RECORDINGS_BUCKET: ${RECORDINGS_BUCKET:-}
      RECORDINGS_KMS_KEY_ID: ${RECORDINGS_KMS_KEY_ID:-alias/aws/s3}
      RECORDINGS_MAX_RETENTION_HOURS: ${RECORDINGS_MAX_RETENTION_HOURS:-720}
      RECORDINGS_MAX_BYTES: ${RECORDINGS_MAX_BYTES:-2147483648}
      PROCESSING_AUDIO_ENABLED: ${PROCESSING_AUDIO_ENABLED:-false}
      PROCESSING_AUDIO_MAX_RETENTION_HOURS: ${PROCESSING_AUDIO_MAX_RETENTION_HOURS:-2}
      PROCESSING_AUDIO_MAX_BYTES: ${PROCESSING_AUDIO_MAX_BYTES:-134217728}
      TRANSCRIPCION_REFINEMENT_TIMEOUT_MINUTES: ${TRANSCRIPCION_REFINEMENT_TIMEOUT_MINUTES:-120}
      ARGOS_DIARIZACION_ENABLED: ${ARGOS_DIARIZACION_ENABLED:-false}
      ARGOS_ESPERA_ASIGNACION_HORAS: ${ARGOS_ESPERA_ASIGNACION_HORAS:-24}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../Argos-Backend:/app
      - argos-maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      transcripcion:
        condition: service_healthy
      emociones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ../Argos-Frontend
      target: development
    container_name: argos-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_APP_ENV: ${VITE_APP_ENV:-development}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../Argos-Frontend:/app
      - argos-frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  transcripcion:
    build:
      # Contexto RAIZ y no servicio-transcripcion/ (ARGOS-169): la etapa constructora del
      # Dockerfile necesita el checkpoint de angel/exported_models/ para generar el encoder
      # emocional durante la build. El modelo pesa 237 MB y GitHub rechaza archivos de mas de
      # 100 MB, asi que se versiona la receta -8 MB- y el binario se construye.
      context: ../Argos-Entrenamiento
      dockerfile: servicio-transcripcion/Dockerfile
      target: production
    container_name: argos-transcripcion
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_EMBEDDING_ENABLED: ${WHISPER_EMBEDDING_ENABLED:-true}
      # Encoder DEDICADO a /embed. NO reemplaza a WHISPER_MODEL: el encoder adaptado degrada la
      # transcripcion en +0,2535 de WER (ADR-025), asi que los dos conviven -uno transcribe, el
      # otro solo alimenta la fusion emocional-.
      #
      # ARGOS-110: se apunta al mismo path que produccion. El build local ya usa target:
      # production del mismo Dockerfile, y esa etapa depende de constructor-modelo -que genera y
      # verifica por sha256 el checkpoint- pase lo que pase con esta variable: dejarla vacia no
      # ahorraba tiempo de build, solo dejaba el resultado sin usar. Sin esto, /embed local caia
      # en el fallback "usa el modelo de transcripcion", que ES un encoder distinto del que la
      # guarda de compatibilidad (encoder_compatible en el servicio de emociones) espera para
      # fusion intermedia: cualquier embedding de audio real se hubiera rechazado con 400.
      WHISPER_EMBEDDING_MODEL: ${WHISPER_EMBEDDING_MODEL:-/modelos/whisper-argos-ser-int8}
      # ARGOS-110. Bandera propia del servicio, distinta de la del backend: sin esto el backend
      # pide agrupar y el servicio devuelve null en silencio. Deriva de la misma variable.
      DIARIZACION_ENABLED: ${ARGOS_DIARIZACION_ENABLED:-false}
      WHISPER_ENCODER_ID: ${WHISPER_ENCODER_ID:-ctranslate2-whisper-small-int8}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_IDIOMA: ${WHISPER_IDIOMA:-es}
      # beam 3 en vivo (seleccion_mvp del benchmark versionado: mismo WER que beam 5, mejor
      # RTF p95). beam 5 se conserva solo para el refinamiento post-sesion, que no compite
      # con la captura en tiempo real.
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-3}
      WHISPER_REFINEMENT_BEAM_SIZE: ${WHISPER_REFINEMENT_BEAM_SIZE:-5}
      WHISPER_HOTWORDS: ${WHISPER_HOTWORDS:-}
      WHISPER_MAX_REFINEMENT_AUDIO_BYTES: ${WHISPER_MAX_REFINEMENT_AUDIO_BYTES:-134217728}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-2}
      WHISPER_MAX_CONCURRENT_INFERENCES: ${WHISPER_MAX_CONCURRENT_INFERENCES:-2}
      WHISPER_VAD_MIN_SILENCE_MS: ${WHISPER_VAD_MIN_SILENCE_MS:-250}
    ports:
      - "${TRANSCRIPCION_PORT:-9000}:9000"
    volumes:
      - argos-whisper-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  emociones:
    build:
      context: ../Argos-Entrenamiento
      dockerfile: servicio-emociones/Dockerfile
    container_name: argos-emociones
    environment:
      EMOCIONES_MODEL_ID: ${EMOCIONES_MODEL_ID:-emotiefflib-enet-b0-8-va-mtl}
      # Calibracion de la confianza visual: se mueven JUNTAS. Ver .env.example.
      EMOCIONES_VIDEO_TEMPERATURE: ${EMOCIONES_VIDEO_TEMPERATURE:-2.40}
      EMOCIONES_VIDEO_MIN_CONFIDENCE: ${EMOCIONES_VIDEO_MIN_CONFIDENCE:-0.291}
      EMOCIONES_FUSION_INTERMEDIA_ENABLED: ${EMOCIONES_FUSION_INTERMEDIA_ENABLED:-true}
      EMOCIONES_FUSION_UMBRAL: ${EMOCIONES_FUSION_UMBRAL:-0.45}
      # Correccion por prior (angel/correccion_por_prior_fusion.py): 1.20 medido sobre RAVDESS con
      # split fit/reporte disjunto en hablante. UAR 0,7795 -> 0,7917, recall 'neutral'
      # 0,6250 -> 0,8125, 'sad' sin retroceder (0,6250 -> 0,6354). Revertir: poner en 0.
      EMOCIONES_FUSION_TAU: ${EMOCIONES_FUSION_TAU:-1.20}
      EMOCIONES_MOCK: ${EMOCIONES_MOCK:-false}
      EMOCIONES_STRICT_LOAD: ${EMOCIONES_STRICT_LOAD:-true}
      EMOCIONES_REQUIRE_FACE_TRACKING: ${EMOCIONES_REQUIRE_FACE_TRACKING:-true}
    ports:
      - "${EMOCIONES_PORT:-9010}:9010"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:9010/health'))['listo']"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  argos-postgres-data:
  argos-maven-cache:
  argos-frontend-node-modules:
  argos-whisper-cache:
