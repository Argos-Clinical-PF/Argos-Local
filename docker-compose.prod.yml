# Compose del ambiente MVP compartido. Corre en una unica EC2 y usa imagenes de ECR.
services:
  profile-storage-init:
    image: alpine:3.22
    container_name: argos-profile-storage-init
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /uploads"]
    volumes:
      - argos-profile-uploads:/uploads
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: argos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - argos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Los logs van a CloudWatch (/argos/mvp, 14 días) porque cada deploy recrea los contenedores y
    # con ellos se perdían. `docker logs` sigue andando por la caché local de Docker (dual logging),
    # con el mismo tope de disco que tenía json-file. En modo non-blocking, si CloudWatch no responde
    # el contenedor arranca igual y se descartan líneas en vez de frenar la aplicación.
    logging: &logging
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /argos/mvp
        tag: "{{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m
        cache-max-size: 10m
        cache-max-file: "3"
    restart: unless-stopped

  transcripcion:
    image: ${ECR_REGISTRY}/argos-transcripcion:${TRANSCRIPCION_TAG}
    container_name: argos-transcripcion
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # ARGOS-110. El servicio tiene su propia bandera, distinta de la del backend: sin esto el
      # backend pide agrupar, el servicio devuelve null porque la suya esta apagada, y el backend
      # loguea "sin agrupamiento utilizable" y sigue. Cero clusters, la compuerta nunca dispara, y
      # todo parece normal. Deriva de la misma variable para que haya un solo interruptor.
      DIARIZACION_ENABLED: ${ARGOS_DIARIZACION_ENABLED:-false}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_IDIOMA: ${WHISPER_IDIOMA:-es}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-3}
      WHISPER_REFINEMENT_BEAM_SIZE: ${WHISPER_REFINEMENT_BEAM_SIZE:-3}
      WHISPER_REFINEMENT_MODEL: ${WHISPER_REFINEMENT_MODEL:-}
      WHISPER_REFINEMENT_CPU_THREADS: ${WHISPER_REFINEMENT_CPU_THREADS:-4}
      WHISPER_HOTWORDS: ${WHISPER_HOTWORDS:-}
      WHISPER_MAX_REFINEMENT_AUDIO_BYTES: ${WHISPER_MAX_REFINEMENT_AUDIO_BYTES:-134217728}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-2}
      WHISPER_MAX_CONCURRENT_INFERENCES: ${WHISPER_MAX_CONCURRENT_INFERENCES:-2}
      WHISPER_VAD_MIN_SILENCE_MS: ${WHISPER_VAD_MIN_SILENCE_MS:-250}
    # Peso de CPU por defecto de Docker, escrito a propósito: es la referencia frente a la que
    # emociones (256) pesa cuatro veces menos cuando las dos compiten.
    cpu_shares: 1024
    volumes:
      - argos-whisper-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    logging: *logging
    restart: unless-stopped

  # ADR-037. El backend transcribe a través de este Caddy: usa el host de inferencia GPU mientras
  # responda sano y el servicio transcripcion de arriba cuando no. Solo interno, sin puertos.
  enrutador-modelos:
    image: caddy:2.10-alpine
    container_name: argos-enrutador-modelos
    # Mismo motivo que el gateway: sin este hash (lo escribe deploy-mvp.sh en el .env), un cambio
    # de Caddyfile.modelos no recrearía el contenedor.
    labels:
      argos.caddyfile-sha256: ${CADDYFILE_MODELOS_SHA256:-}
    volumes:
      - ./Caddyfile.modelos:/etc/caddy/Caddyfile:ro
    depends_on:
      transcripcion:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  emociones:
    image: ${ECR_REGISTRY}/argos-emociones:${EMOCIONES_TAG}
    container_name: argos-emociones
    environment:
      EMOCIONES_MODEL_ID: emotiefflib-enet-b0-8-va-mtl
      # ARGOS-193: temperature scaling y umbral de confianza eliminados (ver .env.example).
      EMOCIONES_VIDEO_MIN_CONFIDENCE: ${EMOCIONES_VIDEO_MIN_CONFIDENCE:-0}
      EMOCIONES_MOCK: "false"
      EMOCIONES_STRICT_LOAD: "true"
      EMOCIONES_REQUIRE_FACE_TRACKING: ${EMOCIONES_REQUIRE_FACE_TRACKING:-true}
      # Un hilo por inferencia en ONNX Runtime, OpenCV y OpenMP. El servicio ya hace una inferencia
      # por vez (un solo lock), y los pools por defecto abren un hilo por núcleo que espera girando y
      # le disputa la CPU a Whisper (ver .env.example).
      EMOCIONES_ORT_HILOS: ${EMOCIONES_ORT_HILOS:-1}
      EMOCIONES_OPENCV_HILOS: ${EMOCIONES_OPENCV_HILOS:-1}
      OMP_NUM_THREADS: "1"
    # Emociones corre en la misma máquina que la transcripción en vivo. Nunca pasa de 1,5 CPU y, con
    # la CPU disputada, recibe un cuarto de lo que recibe transcripción: el análisis visual puede
    # atrasarse, el texto de la sesión no.
    cpus: "1.5"
    cpu_shares: 256
    volumes:
      - argos-emotiefflib-cache:/root/.emotiefflib
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:9010/health', timeout=5))['listo']"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *logging
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/argos-backend:${BACKEND_TAG}
    container_name: argos-backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_MIGRATIONS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${PUBLIC_BASE_URL}}
      APP_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TRANSCRIPCION_SERVICE_URL: http://enrutador-modelos:9100
      # CloudFront corta a los 60 s: 3 intentos de 15 s + 1 s + 2 s de espera = 48 s en el peor caso.
      TRANSCRIPCION_REALTIME_TIMEOUT_SECONDS: ${TRANSCRIPCION_REALTIME_TIMEOUT_SECONDS:-15}
      TRANSCRIPCION_REALTIME_RETRIES: ${TRANSCRIPCION_REALTIME_RETRIES:-2}
      TRANSCRIPCION_REALTIME_BACKOFF_MS: ${TRANSCRIPCION_REALTIME_BACKOFF_MS:-1000}
      EMOCIONES_SERVICE_URL: http://emociones:9010
      EMOCIONES_ENABLED: "true"
      EMOCIONES_TIMEOUT_MS: "5000"
      JWT_SECRET: ${JWT_SECRET}
      # La documentación interactiva de la API no se publica en producción.
      SPRINGDOC_APIDOCS_ENABLED: "false"
      SPRINGDOC_SWAGGERUI_ENABLED: "false"
      JWT_ACCESS_MINUTES: "15"
      JWT_ISSUER: argos-clinical
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS_ENABLE: "true"
      LOGIN_MAX_FAILED_ATTEMPTS: "5"
      # Corto a propósito: el límite por IP es la defensa principal; un bloqueo largo por cuenta
      # permitiría dejar afuera a un profesional sabiendo solo su email.
      LOGIN_LOCK_MINUTES: "5"
      # Con este secreto el backend confía en CloudFront-Viewer-Address solo si la request trae
      # el header que agrega CloudFront (ver DEPLOY.md, «Secreto de origen»).
      ARGOS_SECRETO_CLOUDFRONT: ${ARGOS_SECRETO_CLOUDFRONT:-}
      # Back Office: sin estas dos variables, el seed del primer ADMIN_PLATAFORMA no se ejecuta
      # (nunca hay credenciales por defecto conocidas). Ver Argos-Backend AdminSeedRunner.
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_TOPICS_MODEL: ${ANTHROPIC_TOPICS_MODEL:-claude-haiku-4-5-20251001}
      IA_PROVEEDOR: ${IA_PROVEEDOR:-ANTHROPIC}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # El backend no arranca si ENCRYPTION_KEY o JWT_SECRET faltan o tienen el valor de desarrollo.
      ARGOS_EXIGIR_SECRETOS: "true"
      RECORDINGS_ENABLED: "true"
      RECORDINGS_BUCKET: ${RECORDINGS_BUCKET}
      RECORDINGS_KMS_KEY_ID: ${RECORDINGS_KMS_KEY_ID:-alias/aws/s3}
      RECORDINGS_MAX_RETENTION_HOURS: "720"
      RECORDINGS_MAX_BYTES: ${RECORDINGS_MAX_BYTES:-2147483648}
      RECORDINGS_UPLOAD_URL_MINUTES: "5"
      RECORDINGS_PLAYBACK_URL_SECONDS: "60"
      PROCESSING_AUDIO_ENABLED: "true"
      PROCESSING_AUDIO_MAX_RETENTION_HOURS: "2"
      PROCESSING_AUDIO_MAX_BYTES: "134217728"
      TRANSCRIPCION_REFINEMENT_TIMEOUT_MINUTES: "120"
      # ARGOS-110 (ADR-026). Agrupamiento de voces en sesiones presenciales. Requiere que la imagen
      # de transcripcion traiga el encoder WeSpeaker: encenderla contra una imagen que no lo tiene
      # no rompe nada, simplemente no agrupa.
      ARGOS_DIARIZACION_ENABLED: ${ARGOS_DIARIZACION_ENABLED:-false}
      # Cuanto espera la compuerta humana antes de continuar sola con los hablantes sin verificar.
      ARGOS_ESPERA_ASIGNACION_HORAS: ${ARGOS_ESPERA_ASIGNACION_HORAS:-24}
      # ADR-038. Rastreo del rostro del paciente por cuadros; apagado, la sala manda una foto por
      # ventana como antes. Vacío en el piloto = todos los profesionales (UUIDs separados por coma).
      ARGOS_EMOCIONES_RASTREO_HABILITADO: ${ARGOS_EMOCIONES_RASTREO_HABILITADO:-false}
      ARGOS_EMOCIONES_RASTREO_PILOTO: ${ARGOS_EMOCIONES_RASTREO_PILOTO:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - argos-profile-uploads:/app/uploads/perfiles
    depends_on:
      profile-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      transcripcion:
        condition: service_healthy
      enrutador-modelos:
        condition: service_started
      emociones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/argos-frontend:${FRONTEND_TAG}
    container_name: argos-frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  gateway:
    image: caddy:2.10-alpine
    container_name: argos-gateway
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_IP: ${PUBLIC_IP}
    # Compose no mira el contenido de los archivos montados: sin este hash (lo escribe
    # deploy-mvp.sh en el .env), un cambio del Caddyfile no recrearía el gateway.
    labels:
      argos.caddyfile-sha256: ${CADDYFILE_SHA256:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certbot:/etc/letsencrypt:ro
      - argos-caddy-data:/data
      - argos-caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  argos-postgres-data:
  argos-whisper-cache:
  argos-emotiefflib-cache:
  argos-caddy-data:
  argos-caddy-config:
  argos-profile-uploads:
