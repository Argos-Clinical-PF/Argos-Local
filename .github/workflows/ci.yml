name: Infraestructura CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: 000000000000.dkr.ecr.us-east-1.amazonaws.com
      BACKEND_TAG: sha-validation
      FRONTEND_TAG: sha-validation
      TRANSCRIPCION_TAG: sha-validation
      EMOCIONES_TAG: sha-validation
      RECORDINGS_BUCKET: argos-validation
      PUBLIC_BASE_URL: https://argos.example
      ORIGIN_HOST: origin.argos.example
    steps:
      - uses: actions/checkout@v4

      - name: Validar Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validar Caddyfile del origen propio
        run: |
          docker run --rm \
            -e ORIGIN_HOST=origin.argos.example \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --pretty \
            > caddy.json
          jq -e '.. | objects | select(.host? == ["origin.argos.example"])' caddy.json >/dev/null

      - name: Validar scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

      - name: Validar trazabilidad del bundle de release
        run: |
          grep -Fq 'id: bundle' .github/workflows/deploy.yml
          grep -Fq 'steps.bundle.outputs.sha' .github/workflows/deploy.yml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validar Terraform
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
