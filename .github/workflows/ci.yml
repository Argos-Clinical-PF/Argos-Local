name: Infraestructura CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: 000000000000.dkr.ecr.us-east-1.amazonaws.com
      BACKEND_TAG: sha-validation
      FRONTEND_TAG: sha-validation
      TRANSCRIPCION_TAG: sha-validation
      EMOCIONES_TAG: sha-validation
      RECORDINGS_BUCKET: argos-validation
      IA_PROVEEDOR: BEDROCK
      PUBLIC_BASE_URL: https://argos.example
      PUBLIC_HOST: argos.example
      RTC_HOST: rtc.argos.example
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validar Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validar Caddyfile y TLS sin SNI
        run: |
          docker run --rm \
            -e PUBLIC_IP=192.0.2.10 \
            -e PUBLIC_HOST=example.test \
            -e RTC_HOST=rtc.example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --pretty \
            > caddy.json
          jq -e \
            '[.. | objects | .default_sni? // empty] | index("192.0.2.10") != null' \
            caddy.json >/dev/null

      - name: Validar scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts

      - name: Probar gate de deploy y vigía
        run: ./scripts/probar-deploy-mvp.sh

      - name: Validar trazabilidad del bundle de release
        run: |
          grep -Fq 'id: bundle' .github/workflows/deploy.yml
          grep -Fq 'steps.bundle.outputs.sha' .github/workflows/deploy.yml

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.8

      - name: Validar Terraform
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
