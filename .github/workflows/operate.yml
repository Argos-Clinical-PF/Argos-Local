name: Operate MVP

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operacion
        required: true
        type: choice
        options:
          - start
          - stop
          - status
      gpu:
        description: Con start, encender también el host de inferencia GPU (sin capacidad sigue en CPU)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::616322963974:role/argos-github-actions

jobs:
  operate:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descubrir instancia
        id: aws
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=argos-app Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          PUBLIC_IP=$(aws ec2 describe-addresses \
            --filters Name=tag:Name,Values=argos-eip \
            --query 'Addresses[0].PublicIp' --output text)
          PUBLIC_URL=$(aws ssm get-parameter --name /argos/mvp/public-base-url \
            --query Parameter.Value --output text 2>/dev/null || true)
          [ -n "$PUBLIC_URL" ] || PUBLIC_URL="https://${PUBLIC_IP//./-}.sslip.io"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      # ADR-037. Se pide antes de arrancar la app para que ambos booteen a la vez. Si falla (o no hay
      # capacidad GPU en ninguna zona) la app transcribe en su CPU: nunca frena el start.
      - name: Encender host de inferencia GPU
        if: inputs.action == 'start' && inputs.gpu
        run: |
          aws autoscaling set-desired-capacity --auto-scaling-group-name argos-inferencia --desired-capacity 1 \
            || echo "::warning::No se pudo pedir el host GPU; la transcripción va a correr en la CPU de la app."

      - name: Iniciar
        if: inputs.action == 'start'
        run: |
          INSTANCE_ID="${{ steps.aws.outputs.instance_id }}"
          ESTADO=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$ESTADO" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            ESTADO="stopped"
          fi
          if [ "$ESTADO" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          elif [ "$ESTADO" != "running" ] && [ "$ESTADO" != "pending" ]; then
            echo "Estado EC2 no recuperable: $ESTADO"
            exit 1
          fi
          aws ec2 wait instance-status-ok --instance-ids "${{ steps.aws.outputs.instance_id }}"
          SSM_ONLINE=false
          for _ in $(seq 1 30); do
            ESTADO=$(aws ssm describe-instance-information \
              --filters Key=InstanceIds,Values=${{ steps.aws.outputs.instance_id }} \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            if [ "$ESTADO" = "Online" ]; then
              SSM_ONLINE=true
              break
            fi
            sleep 10
          done
          if [ "$SSM_ONLINE" != "true" ]; then
            echo "La instancia no quedo disponible en Systems Manager."
            exit 1
          fi
          PARAMETERS=$(jq -cn '{commands:["/home/ec2-user/argos/refresh-ip-certificate.sh"]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "${{ steps.aws.outputs.instance_id }}" \
            --document-name AWS-RunShellScript --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text)
          CERTIFICADO_OK=false
          for _ in $(seq 1 60); do
            ESTADO=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.aws.outputs.instance_id }}" --query Status --output text 2>/dev/null || true)
            if [ "$ESTADO" = "Success" ]; then
              CERTIFICADO_OK=true
              break
            fi
            case "$ESTADO" in Failed|Cancelled|TimedOut) exit 1 ;; esac
            sleep 5
          done
          if [ "$CERTIFICADO_OK" != "true" ]; then
            echo "La renovacion del certificado HTTPS de la Elastic IP no finalizo."
            exit 1
          fi
          for _ in $(seq 1 30); do
            curl --fail --silent --show-error "${{ steps.aws.outputs.url }}/api/health" && exit 0
            sleep 10
          done
          exit 1

      - name: Esperar host de inferencia GPU
        if: inputs.action == 'start' && inputs.gpu
        run: |
          for _ in $(seq 1 60); do
            EN_SERVICIO=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names argos-inferencia \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'] | [0].[InstanceType,AvailabilityZone]" \
              --output text 2>/dev/null || true)
            if [ -n "$EN_SERVICIO" ] && [ "$EN_SERVICIO" != "None" ]; then
              echo "Host GPU en servicio: $EN_SERVICIO. El enrutador lo usa cuando cargue el modelo."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::El host GPU no quedó en servicio en 10 minutos (¿sin capacidad?); la transcripción sigue en la CPU de la app y el ASG sigue intentando."

      - name: Detener
        if: inputs.action == 'stop'
        run: |
          ESTADO=$(aws ec2 describe-instances --instance-ids "${{ steps.aws.outputs.instance_id }}" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$ESTADO" = "running" ]; then
            aws ec2 stop-instances --instance-ids "${{ steps.aws.outputs.instance_id }}"
          fi

      # Aunque falle el paso anterior: la GPU no debe quedar facturando sola. Si esto tampoco anda,
      # el vigía del host la baja a los 10 minutos como mucho de ver la app detenida.
      - name: Apagar host de inferencia GPU
        if: always() && inputs.action == 'stop'
        run: |
          EXISTE=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names argos-inferencia \
            --query 'length(AutoScalingGroups)' --output text)
          if [ "$EXISTE" = "0" ]; then
            echo "No existe el ASG argos-inferencia; nada que apagar."
            exit 0
          fi
          aws autoscaling set-desired-capacity --auto-scaling-group-name argos-inferencia --desired-capacity 0

      - name: Estado
        run: |
          aws ec2 describe-instances --instance-ids "${{ steps.aws.outputs.instance_id }}" \
            --query 'Reservations[0].Instances[0].{Estado:State.Name,IP:PublicIpAddress}' --output table
          echo "URL: ${{ steps.aws.outputs.url }}"

      # Informativo: nunca falla. La salud se consulta desde el enrutador de la app, que es quien
      # decide si manda la transcripción a la GPU o a la CPU.
      - name: Estado del host de inferencia GPU
        if: always() && steps.aws.outcome == 'success'
        run: |
          ASG=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names argos-inferencia \
            --query 'AutoScalingGroups[0]' --output json 2>/dev/null || true)
          if [ -z "$ASG" ] || [ "$ASG" = "null" ]; then
            echo "Host GPU: no existe el ASG argos-inferencia."
            exit 0
          fi
          jq -r '"Host GPU: desired \(.DesiredCapacity)",
            (.Instances[] | "  \(.InstanceId) \(.InstanceType) \(.AvailabilityZone) \(.LifecycleState) \(.HealthStatus)")' <<<"$ASG"
          ESTADO=$(aws ec2 describe-instances --instance-ids "${{ steps.aws.outputs.instance_id }}" \
            --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || true)
          if [ "$ESTADO" != "running" ] || [ "$(jq '.Instances | length' <<<"$ASG")" = "0" ]; then
            exit 0
          fi
          PARAMETERS=$(jq -cn '{commands:["docker exec argos-enrutador-modelos wget -qO- -T 5 http://inferencia.argos.internal:9000/health || echo el enrutador no alcanza el host GPU: la transcripcion va a la CPU"]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "${{ steps.aws.outputs.instance_id }}" \
            --document-name AWS-RunShellScript --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text 2>/dev/null || true)
          [ -n "$COMMAND_ID" ] || exit 0
          for _ in $(seq 1 12); do
            SALIDA=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.aws.outputs.instance_id }}" --query StandardOutputContent --output text 2>/dev/null || true)
            if [ -n "$SALIDA" ]; then
              echo "Salud vista por el enrutador: $SALIDA"
              exit 0
            fi
            sleep 5
          done
