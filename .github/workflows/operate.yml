name: Operate MVP

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operacion
        required: true
        type: choice
        options:
          - start
          - stop
          - status

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::915093573341:role/argos-github-actions

jobs:
  operate:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descubrir instancia
        id: aws
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=argos-app Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          PUBLIC_URL=$(aws ssm get-parameter --name /argos/mvp/public-base-url \
            --query Parameter.Value --output text 2>/dev/null || true)
          [ -n "$PUBLIC_URL" ] || PUBLIC_URL="https://argosclinical.online"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Iniciar
        if: inputs.action == 'start'
        run: |
          INSTANCE_ID="${{ steps.aws.outputs.instance_id }}"
          ESTADO=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$ESTADO" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            ESTADO="stopped"
          fi
          if [ "$ESTADO" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          elif [ "$ESTADO" != "running" ] && [ "$ESTADO" != "pending" ]; then
            echo "Estado EC2 no recuperable: $ESTADO"
            exit 1
          fi
          aws ec2 wait instance-status-ok --instance-ids "${{ steps.aws.outputs.instance_id }}"
          SSM_ONLINE=false
          for _ in $(seq 1 30); do
            ESTADO=$(aws ssm describe-instance-information \
              --filters Key=InstanceIds,Values=${{ steps.aws.outputs.instance_id }} \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            if [ "$ESTADO" = "Online" ]; then
              SSM_ONLINE=true
              break
            fi
            sleep 10
          done
          if [ "$SSM_ONLINE" != "true" ]; then
            echo "La instancia no quedo disponible en Systems Manager."
            exit 1
          fi
          for _ in $(seq 1 30); do
            curl --fail --silent --show-error "${{ steps.aws.outputs.url }}/api/health" && exit 0
            sleep 10
          done
          exit 1

      - name: Detener
        if: inputs.action == 'stop'
        run: |
          ESTADO=$(aws ec2 describe-instances --instance-ids "${{ steps.aws.outputs.instance_id }}" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$ESTADO" = "running" ]; then
            aws ec2 stop-instances --instance-ids "${{ steps.aws.outputs.instance_id }}"
          fi

      - name: Estado
        run: |
          aws ec2 describe-instances --instance-ids "${{ steps.aws.outputs.instance_id }}" \
            --query 'Reservations[0].Instances[0].{Estado:State.Name,IP:PublicIpAddress}' --output table
          echo "URL: ${{ steps.aws.outputs.url }}"
